name: daily-steamspy-fetch

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/fetch_steamspy.py
      - uses: actions/upload-artifact@v4
        with:
          name: steamspy-data
          path: steamspy_*.jsonl
